openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: M4Chat API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User operations
  - name: chats
    description: Chat operations
  - name: messages
    description: Message operations
  - name: files
    description: File upload operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
        "409":
          description: Username already taken

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/devices:
    get:
      operationId: getDevices
      tags: [auth]
      summary: List active sessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"

  /auth/devices/{id}/revoke:
    delete:
      operationId: revokeDevice
      tags: [auth]
      summary: Revoke a session
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked

  /auth/2fa/setup:
    post:
      operationId: setup2FA
      tags: [auth]
      summary: Setup 2FA TOTP
      security:
        - bearerAuth: []
      responses:
        "200":
          description: QR code and secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  qrCodeUrl:
                    type: string

  /auth/2fa/verify:
    post:
      operationId: verify2FA
      tags: [auth]
      summary: Verify 2FA code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean

  # Users
  /users/search:
    get:
      operationId: searchUsers
      tags: [users]
      summary: Search users
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserPublic"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"

  /users/me:
    put:
      operationId: updateProfile
      tags: [users]
      summary: Update own profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # Chats
  /chats:
    get:
      operationId: getChats
      tags: [chats]
      summary: Get all chats for current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Chats list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatItem"
    post:
      operationId: createChat
      tags: [chats]
      summary: Create new chat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatRequest"
      responses:
        "201":
          description: Chat created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"

  /chats/{chatId}:
    get:
      operationId: getChat
      tags: [chats]
      summary: Get chat by ID
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chat details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDetail"
    delete:
      operationId: deleteChat
      tags: [chats]
      summary: Delete/leave chat
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  /chats/{chatId}/members:
    get:
      operationId: getChatMembers
      tags: [chats]
      summary: Get chat members
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Members list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMember"
    post:
      operationId: addChatMember
      tags: [chats]
      summary: Add member to chat
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: integer
      responses:
        "201":
          description: Member added

  /chats/{chatId}/members/{userId}:
    delete:
      operationId: removeChatMember
      tags: [chats]
      summary: Remove member from chat
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member removed

  /chats/{chatId}/invite:
    post:
      operationId: generateInviteLink
      tags: [chats]
      summary: Generate invite link
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invite link
          content:
            application/json:
              schema:
                type: object
                properties:
                  inviteLink:
                    type: string

  /chats/join/{inviteLink}:
    post:
      operationId: joinByInvite
      tags: [chats]
      summary: Join chat by invite link
      security:
        - bearerAuth: []
      parameters:
        - name: inviteLink
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"

  # Messages
  /chats/{chatId}/messages:
    get:
      operationId: getMessages
      tags: [messages]
      summary: Get messages for a chat
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Messages list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send message
      security:
        - bearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /messages/{messageId}:
    put:
      operationId: editMessage
      tags: [messages]
      summary: Edit message
      security:
        - bearerAuth: []
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "200":
          description: Message edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    delete:
      operationId: deleteMessage
      tags: [messages]
      summary: Delete message (soft delete)
      security:
        - bearerAuth: []
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Message deleted

  /messages/{messageId}/reactions:
    post:
      operationId: addReaction
      tags: [messages]
      summary: Add reaction
      security:
        - bearerAuth: []
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji:
                  type: string
      responses:
        "201":
          description: Reaction added

  /messages/{messageId}/pin:
    post:
      operationId: pinMessage
      tags: [messages]
      summary: Pin/unpin message
      security:
        - bearerAuth: []
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pinned:
                  type: boolean
      responses:
        "200":
          description: Pinned state updated

  /messages/search:
    get:
      operationId: searchMessages
      tags: [messages]
      summary: Search messages
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: chatId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  # Files
  /files/upload:
    post:
      operationId: uploadFile
      tags: [files]
      summary: Upload file
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                chatId:
                  type: integer
      responses:
        "201":
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileItem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
        password:
          type: string
          minLength: 6
        email:
          type: string
          format: email
        phone:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
        refreshToken:
          type: string
      required:
        - user
        - token

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
        bio:
          type: string
        isOnline:
          type: boolean
        lastSeenAt:
          type: string
          format: date-time
        twoFAEnabled:
          type: boolean
      required:
        - id
        - username

    UserPublic:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        avatarUrl:
          type: string
        bio:
          type: string
        isOnline:
          type: boolean
        lastSeenAt:
          type: string
          format: date-time
      required:
        - id
        - username

    UpdateProfileRequest:
      type: object
      properties:
        email:
          type: string
        phone:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string

    Session:
      type: object
      properties:
        id:
          type: integer
        deviceInfo:
          type: string
        ipAddress:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required:
        - id

    Chat:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [private, group, channel]
        photo:
          type: string
        inviteLink:
          type: string
        pinnedMessageId:
          type: integer
        isArchived:
          type: boolean
        createdBy:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type

    ChatItem:
      allOf:
        - $ref: "#/components/schemas/Chat"
        - type: object
          properties:
            role:
              type: string
            unreadCount:
              type: integer
            lastMessage:
              $ref: "#/components/schemas/MessagePreview"

    ChatDetail:
      allOf:
        - $ref: "#/components/schemas/Chat"
        - type: object
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/ChatMember"

    CreateChatRequest:
      type: object
      required: [type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [private, group, channel]
        participantIds:
          type: array
          items:
            type: integer

    ChatMember:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: string
        avatarUrl:
          type: string
        role:
          type: string
          enum: [creator, admin, member, restricted]
        joinedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - role

    Message:
      type: object
      properties:
        id:
          type: integer
        chatId:
          type: integer
        senderId:
          type: integer
        senderName:
          type: string
        senderAvatar:
          type: string
        content:
          type: string
        messageType:
          type: string
          enum: [text, image, file, voice, video, poll]
        mediaUrl:
          type: string
        replyTo:
          type: integer
        isEdited:
          type: boolean
        isDeleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/Reaction"
      required:
        - id
        - chatId
        - messageType
        - createdAt

    MessagePreview:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        messageType:
          type: string
        senderId:
          type: integer
        senderName:
          type: string
        createdAt:
          type: string
          format: date-time

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        messageType:
          type: string
          default: text
        mediaUrl:
          type: string
        replyTo:
          type: integer

    Reaction:
      type: object
      properties:
        emoji:
          type: string
        count:
          type: integer
        mine:
          type: boolean

    FileItem:
      type: object
      properties:
        id:
          type: integer
        fileKey:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        url:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - url
