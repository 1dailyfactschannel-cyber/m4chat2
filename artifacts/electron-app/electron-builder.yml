appId: com.m4chat.app
productName: M4Chat
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build-resources

files:
  - dist/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: ../api-server/dist
    to: api-server/dist
    filter:
      - "**/*"
  - from: ../mockup-sandbox/dist
    to: frontend/dist
    filter:
      - "**/*"

protocols:
  - name: M4Chat Protocol
    schemes:
      - m4chat

mac:
  category: public.app-category.social-networking
  target:
    - dmg
    - zip
  icon: build-resources/icon.icns

win:
  target:
    - nsis
  icon: build-resources/icon.ico

linux:
  target:
    - AppImage
  category: Network
  icon: build-resources/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true

publish:
  provider: generic
  url: https://updates.m4chat.com/
