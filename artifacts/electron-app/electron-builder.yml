appId: com.m4chat.app
productName: M4Chat
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build-resources

files:
  - dist/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: ../api-server/dist
    to: api-server/dist
    filter:
      - "**/*"
  - from: ../mockup-sandbox/dist
    to: frontend/dist
    filter:
      - "**/*"

protocols:
  - name: M4Chat Protocol
    schemes:
      - m4chat

win:
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true

publish:
  provider: generic
  url: https://updates.m4chat.com/
