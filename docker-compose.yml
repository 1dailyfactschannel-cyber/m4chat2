# ==========================================
# M4Chat - Production Docker Compose
# ==========================================
#
# ДЛЯ ДЕПЛОЯ ЧЕРЕЗ PORTAINER REPOSITORY:
#
# 1. Portainer → Stacks → Add stack
# 2. Method: Repository
# 3. Repository URL: https://github.com/1dailyfactschannel-cyber/m4chat2.git
# 4. Repository reference: refs/heads/main
# 5. Compose path: docker-compose.yml
# 6. Automatic updates: Enable (опционально)
# 7. Webhook: Enable (для авто-обновления при push)
#
# Порты:
# - 5446: PostgreSQL (внешний доступ)
# - 8083: API (напрямую)
# - 8082: Web интерфейс (Nginx с прокси)
# - 9010: RustFS S3 API (внешний, внутри сети rustfs:9000)
# - 9001: RustFS Console (опционально)

services:
  # ==========================================
  # 1. PostgreSQL Database
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: m4chat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-XYL9zWCqwjACdnm}
      POSTGRES_DB: m4chat_pg
    ports:
      - "5446:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d m4chat_pg"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - m4chat-network

  # ==========================================
  # 2. RustFS Object Storage
  # ==========================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: m4chat-rustfs
    restart: unless-stopped
    environment:
      - RUSTFS_ROOT_USER=${S3_ACCESS_KEY:-m4chat}
      - RUSTFS_ROOT_PASSWORD=${S3_SECRET_KEY:-changeme}
    ports:
      - "9010:9000"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - m4chat-network

  # ==========================================
  # 3. API Backend
  # ==========================================
  api:
    build:
      context: .
      target: api
      dockerfile: Dockerfile
    container_name: m4chat-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-XYL9zWCqwjACdnm}@db:5432/m4chat_pg
      PORT: 8080
      NODE_ENV: production
      ADMIN_TOKEN: ${ADMIN_TOKEN:-m4chat-secret-admin-token-2024}
      JWT_SECRET: ${JWT_SECRET:-m4chat-jwt-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      UPLOAD_DIR: /app/uploads
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-m4chat}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-changeme}
      S3_BUCKET: ${S3_BUCKET:-m4chat}
      S3_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "8083:8080"
    expose:
      - "8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - m4chat-network

  # ==========================================
  # 4. Frontend Web (nginx с проксированием)
  # ==========================================
  web:
    image: nginx:alpine
    container_name: m4chat-web
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - api
    networks:
      - m4chat-network
    command: >
      sh -c "
        echo 'server {
          listen 80;
          server_name localhost;
          
          location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files \$$uri \$$uri/ /index.html;
          }
          
          location /api/ {
            proxy_pass http://api:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host \$$host;
            proxy_set_header X-Real-IP \$$remote_addr;
            proxy_set_header Upgrade \$$http_upgrade;
            proxy_set_header Connection \"upgrade\";
          }
          
          location /admin/ {
            proxy_pass http://api:8080/admin/;
            proxy_http_version 1.1;
            proxy_set_header Host \$$host;
            proxy_set_header X-Real-IP \$$remote_addr;
          }
          
          location /socket/ {
            proxy_pass http://api:8080/socket/;
            proxy_http_version 1.1;
            proxy_set_header Host \$$host;
            proxy_set_header X-Real-IP \$$remote_addr;
            proxy_set_header Upgrade \$$http_upgrade;
            proxy_set_header Connection \"upgrade\";
          }
          
          location /health {
            proxy_pass http://api:8080/health;
          }
        }' > /etc/nginx/conf.d/default.conf &&
        nginx -g 'daemon off;'
      "

volumes:
  postgres_data:
    driver: local
  rustfs_data:
    driver: local
  uploads_data:
    driver: local

networks:
  m4chat-network:
    driver: bridge
